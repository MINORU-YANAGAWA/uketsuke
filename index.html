<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR受付</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
    h1 { font-size: 24px; color: #333; }
    #canvas { width: 100%; max-width: 450px; border-radius: 12px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    #status { margin: 20px auto; max-width: 450px; padding: 20px; font-size: 22px; font-weight: bold; border-radius: 12px; background: #fff; border: 2px dashed #ccc; }
    .success { background: #d4edda !important; color: #155724 !important; border: 2px solid #c3e6cb !important; }
    .error { background: #f8d7da !important; color: #721c24 !important; border: 2px solid #f5c6cb !important; }
    .already { background: #fff3cd !important; color: #856404 !important; border: 2px solid #ffeeba !important; }
  </style>
</head>
<body>
  <h1>QRコードをかざしてください</h1>
  <video id="video" playsinline style="display:none;"></video>
  <canvas id="canvas"></canvas>
  <div id="status">カメラを起動中...</div>

  <script>
    // ⚠️【必須】ご自身のGASのURL（/execで終わるもの）を入れてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxmcUNis7saDV1X2MljybMBHAUR8dksjb3ZcSN0fB-5xSDcmeRslxApr7Ajxf9FQZu1/exec";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("status");
    let isProcessing = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
        statusDiv.innerText = "かざしてください";
      })
      .catch(() => {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            requestAnimationFrame(tick);
            statusDiv.innerText = "かざしてください";
          })
          .catch(() => { statusDiv.innerText = "カメラの起動に失敗しました"; });
      });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        if (!isProcessing) {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
          if (code && code.data) onScan(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    // JSONP通信（iOSのCORSブロックを回避）
    function onScan(qrData) {
      isProcessing = true;
      statusDiv.className = "";
      statusDiv.innerText = "検知しました！照合中...";

      const callbackName = "gasCallback_" + Date.now();

      window[callbackName] = function(data) {
        if (data.success) {
          statusDiv.className = "success";
          statusDiv.innerHTML = "⭕ 受付完了<br><br>" + data.name + " 様";
        } else if (data.alreadyChecked) {
          statusDiv.className = "already";
          statusDiv.innerHTML = "⚠️ すでに受付済みです<br><br>" + data.name + " 様";
        } else {
          statusDiv.className = "error";
          statusDiv.innerText = "❌ " + data.message;
        }

        delete window[callbackName];
        const elem = document.getElementById(callbackName);
        if (elem) elem.remove();

        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.innerText = "かざしてください";
          isProcessing = false;
        }, 3000);
      };

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = `${GAS_URL}?prefix=${callbackName}&qrData=${encodeURIComponent(qrData)}`;
      
      script.onerror = function() {
        statusDiv.className = "error";
        statusDiv.innerText = "通信エラー（URLを確認してください）";
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.innerText = "かざしてください";
          isProcessing = false;
        }, 3000);
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
